version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: livepoll-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - livepoll-network

  redis:
    image: redis:7-alpine
    container_name: livepoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - livepoll-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: livepoll-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=livepolling
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=guvi-developer-internship-docker-secret-2026
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - livepoll-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: livepoll-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080
    depends_on:
      - backend
    networks:
      - livepoll-network

volumes:
  mongo_data:
  redis_data:

networks:
  livepoll-network:
    driver: bridge
